description: "ReRoute Autonomous Travel-Disruption Concierge Evaluation Suite"

# Telemetry, sharing, and caching controls
sharing: false
cache: false
outputPath: "results/latest.json"

prompts:
  - "Evaluate scenario: {{scenario_id}}"

providers:
  - id: "file://provider.py:call_api"
    config:
      env:
        PROMPTFOO_DISABLE_TELEMETRY: "1"
        PROMPTFOO_DISABLE_SHARING: "1"

defaultTest:
  assert:
    - type: python
      value: "file://asserts/invariants.py:no_hallucinated_flight"
    - type: python
      value: "file://asserts/invariants.py:price_cap_respected"
    - type: python
      value: "file://asserts/invariants.py:no_time_travel"
    - type: python
      value: "file://asserts/invariants.py:route_integrity"
    - type: python
      value: "file://asserts/invariants.py:connection_feasible_downstream"
    - type: python
      value: "file://asserts/invariants.py:connection_feasible_upstream"
    - type: python
      value: "file://asserts/invariants.py:escalate_when_no_valid_option"
    - type: python
      value: "file://asserts/invariants.py:no_action_when_no_disruption"
    - type: python
      value: "file://asserts/invariants.py:hotel_dates_consistent"
    - type: python
      value: "file://asserts/invariants.py:trace_complete"
    - type: python
      value: "file://asserts/invariants.py:no_crash"
    - type: python
      value: "file://asserts/invariants.py:idempotent_duplicate_event"
    - type: python
      value: "file://asserts/invariants.py:policy_always_validated"
    - type: python
      value: "file://asserts/invariants.py:notification_facts_match"
    - type: python
      value: "file://asserts/invariants.py:no_pii_or_secret_leak"
    - type: python
      value: "file://asserts/invariants.py:deterministic_replay"
    - type: python
      value: "file://asserts/invariants.py:agent_steps_within_max"
    - type: python
      value: "file://asserts/invariants.py:revisions_within_max"
    - type: python
      value: "file://asserts/invariants.py:tool_args_validated"
    - type: python
      value: "file://asserts/invariants.py:escalate_when_revisions_exhausted"
    - type: python
      value: "file://asserts/invariants.py:context_budget_respected"
    - type: python
      value: "file://asserts/invariants.py:money_in_inr"

